<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas Casa">
<meta name="theme-color" content="#f6f4ef">
<title>Contas da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f1c; --ink2:#5b5f58; --mute:#8f938b; --line:#e7e4dc;
  --acc:#1f5f4a; --acc2:#e6efe9; --dai:#e0663f; --alex:#3a6ad6; --warn:#b7791f; --bad:#c0392b;
  --r:18px; --sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
.top h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:700}
.me{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}
.me i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.mnav b{font-size:24px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.mnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.hero .lbl{color:var(--ink2);font-size:13px;font-weight:600}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:2px 0 10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{border-radius:14px;padding:10px 12px;background:#faf9f6;border:1px solid var(--line);min-width:0;width:100%;color:inherit}
.split>*{min-width:0}
.who .row{gap:6px}
.who .row span:last-child{white-space:nowrap}
.who .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .n{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.who .n i{width:8px;height:8px;border-radius:50%}
.who .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:4px}
.who .row span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.saldo{margin-top:12px;border-radius:14px;padding:12px;background:var(--acc2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.saldo .t{font-weight:700;font-size:14.5px}
.saldo .s{font-size:12px;color:var(--ink2)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--acc);color:#fff}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid #c9dbd1}
.btn.light{background:#efede7;color:var(--ink)}
.btn.bad{background:#fbeceb;color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.sec h2{font-size:15px;margin:0;font-weight:800}
.sec span{font-size:12.5px;color:var(--mute)}
.pend{border:1.5px dashed #d8b46a;background:#fffaf0}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f1e6cc}
.pitem:first-of-type{border-top:0}
.pitem .x{flex:1;min-width:0}
.pitem .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .x small{color:var(--ink2)}
.fixas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.fixas::-webkit-scrollbar{display:none}
.fx{flex:0 0 auto;border-radius:14px;padding:10px 12px;background:var(--card);box-shadow:var(--sh);min-width:132px;border:0;text-align:left}
.fx .n{font-weight:700;font-size:13px}
.fx .v{font-size:12px;color:var(--ink2);margin-top:2px}
.fx .st{font-size:11px;font-weight:700;margin-top:6px;display:inline-block;padding:2px 7px;border-radius:99px}
.fx.ok .st{background:#e3f1e8;color:#1f6b45}
.fx.no .st{background:#fdf0dc;color:#94600f}
.fx.late .st{background:#fbe4e1;color:var(--bad)}
.cats .c{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 0}
.cats .c .e{font-size:18px;text-align:center}
.cats .bar{height:6px;background:#efede7;border-radius:4px;margin-top:5px;overflow:hidden}
.cats .bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.cats .c .nm{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;align-items:baseline}
.cats .c .nm small{font-size:11.5px}
.cats .c{min-width:0}.cats .c>div{min-width:0}
.cats .c .nm small{color:var(--mute);font-weight:500}
.cats .c .vv{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.day{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 6px}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #f2f0ea;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.it:first-child{border-top:0}
.it .ic{width:38px;height:38px;border-radius:12px;background:#f3f1ec;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.it .x{flex:1;min-width:0}
.it .x b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .x small{color:var(--ink2);font-size:12.5px}
.it .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.it .v small{display:block;font-weight:600;font-size:11.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#efe9fb;color:#5a3fa8;margin-left:4px;vertical-align:1px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--acc);color:#fff;border:0;font-size:30px;box-shadow:0 8px 24px rgba(31,95,74,.35);z-index:20}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:19}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mute);padding:4px 6px;flex:1}
.tabs button span{font-size:20px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--acc)}
.tabs button.on span{filter:none;opacity:1}
.acb{position:absolute;top:-2px;left:50%;margin-left:4px;font-size:9.5px;font-weight:800;color:#fff;border-radius:99px;padding:1px 5px;white-space:nowrap;line-height:1.4}
.empty{color:var(--mute);text-align:center;padding:28px 10px;font-size:14px}
.note{font-size:12.5px;color:var(--ink2);background:#fff6e5;border-radius:12px;padding:10px 12px;margin-bottom:12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,22,18,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#d6d3cb;margin:0 auto 10px}
.sheet h3{margin:4px 0 12px;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.capt{background:#efe9fb;color:#4a3394;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.amt{display:flex;align-items:center;background:var(--card);border-radius:16px;padding:6px 14px;box-shadow:var(--sh)}
.amt span{font-size:22px;font-weight:700;color:var(--mute);margin-right:6px}
.amt input{border:0;outline:0;font-size:34px;font-weight:800;width:100%;background:none;padding:6px 0;letter-spacing:-.02em}
.fld{margin-top:12px}
.fld>label{display:block;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:0 2px 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;outline:0}
.inp:focus{border-color:var(--acc)}
.sugs{margin-top:6px;background:var(--card);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.sug{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-top:1px solid #f2f0ea;text-align:left}
.sug:first-child{border-top:0}
.sug b{font-weight:700}
.sug small{color:var(--mute);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ebe8e1;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.splitbar{height:10px;border-radius:6px;overflow:hidden;display:flex;margin:10px 0 6px;gap:2px}
.splitbar i{display:block;height:100%}
.splitlbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1;padding:14px;font-size:15px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px}
/* settings */
.set h4{margin:0 0 8px;font-size:15px}
.set p{margin:6px 0;font-size:13.5px;color:var(--ink2);line-height:1.45}
.set ol{margin:6px 0;padding-left:20px;font-size:13.5px;line-height:1.55}
.set code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#f1efe9;border-radius:6px;padding:1px 5px;word-break:break-all}
.fxe{display:grid;grid-template-columns:1fr 70px;gap:6px;padding:10px 0;border-top:1px solid #f2f0ea}
.fxe:first-of-type{border-top:0}
.fxe .inp{padding:9px 10px;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.tip{font-size:13px;color:var(--ink2);min-height:20px;margin-top:6px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:#1d1f1c;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;transition:transform .25s;max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.status{font-size:12px;color:var(--mute);text-align:center;margin:8px 0}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><h1>Contas da Casa</h1><button class="me" id="meBtn"><i style="background:#ccc"></i>…</button></div>
  <div id="view"><div class="status">Carregando…</div></div>
</div>
<button class="fab" id="fab" aria-label="Novo lançamento">+</button>
<nav class="tabs">
  <button data-tab="mes" class="on"><span>🏠</span>Mês</button>
  <button data-tab="analise"><span>📊</span>Análise</button>
  <button data-tab="fin"><span>💰</span>Finanças</button>
  <button data-tab="alu"><span>🔑</span>Aluguéis</button>
  <button data-tab="acertos" id="tabAc" style="position:relative"><span>🔁</span>Acertos<b id="acBadge" class="acb" style="display:none"></b></button>
  <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ===================== CONFIGURAÇÃO DO FIREBASE =====================
   Cole aqui o firebaseConfig do seu projeto (Configurações do projeto → Seus apps → Web). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBOggIJFVw6wdwg4xtSJkRpIDnSPB-jjv4",
  authDomain: "contas-casa-5a820.firebaseapp.com",
  projectId: "contas-casa-5a820",
  storageBucket: "contas-casa-5a820.firebasestorage.app",
  messagingSenderId: "284411875480",
  appId: "1:284411875480:web:a37a56751217142a9880ed"
};
/* ===================== constantes ===================== */
const APP_URL = location.origin + location.pathname;
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CATS=[['Super','🛒'],['Restaurante','🍽️'],['Comida','🥡'],['Transporte','⛽'],['Moradia','🏠'],['Internet','📶'],['CEEE','💡'],['Diversão','🎉'],['Férias','🏖️'],['Equipamentos','🛠️'],['Pets','🐶'],['Saúde','🩺'],['Remédios','💊'],['Festa','🎈'],['Presentes','🎁'],['Família','👨‍👩‍👧'],['Projeto','📐'],['Marcenaria','🪚'],['Mudança','📦'],['Outros','•'],['Acerto','🔁']];
const COTA_PADRAO={Super:.6,Restaurante:.6,Comida:.6,CEEE:.6,Moradia:.6};
const CATS_PADRAO=CATS.filter(c=>c[0]!=='Acerto').map(([n,e])=>({nome:n,e,cd:COTA_PADRAO[n]??.5}));
function cats(){const c=S.cfg&&Array.isArray(S.cfg.cats)&&S.cfg.cats.length?S.cfg.cats:CATS_PADRAO;return c}
function emo(t){if(t==='Acerto')return '🔁';const c=cats().find(x=>x.nome===t);return c?c.e:'•'}
function cotaCat(t){const c=cats().find(x=>x.nome===t);return c?+c.cd:.5}
function kk(l){return norm(l).replace(/ /g,'_')||'_'}
function lugCfg(){return (S.cfg&&S.cfg.lugares)||{}}
function aliasL(l){const L=lugCfg();let n=l,k=0,r=L[kk(n)];while(r&&r.alias&&k++<6){if(r.alias===n)break;n=r.alias;r=L[kk(n)]}return n}
function resolveCat(t){const r=(S.cfg&&S.cfg.renomes)||{};let k=0;while(r[t]&&k++<20)t=r[t];return t}
const FIXAS_PADRAO=[
  {nome:'Aluguel + Condomínio',t:'Moradia',dia:9,v:4613.04,cd:.6,chaves:'aluguel,condom'},
  {nome:'Internet (Claro)',t:'Internet',dia:23,v:99.9,cd:.5,chaves:'internet,claro'},
  {nome:'Luz (CEEE)',t:'CEEE',dia:26,v:350,cd:.5,chaves:'ceee,luz'},
];
/* ===================== estado ===================== */
const S={fins:{dai:{cfg:null,meses:{}},alex:{cfg:null,meses:{}}},fin:null,fw:null,alu:{cfg:null,meses:{}},db:null,user:null,uid:null,me:null,hist:{},tx:[],pend:[],cfg:null,mes:ym(new Date()),tab:'mes',loaded:{hist:false,tx:false},local:false,ro:false,queueHash:null};
let IDX=null; // índice de sugestões
/* ===================== utils ===================== */
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function brl(v){return fmtBRL.format(v||0)}
function brl0(v){return 'R$ '+Math.round(v||0).toLocaleString('pt-BR')}
function pct(x){return Math.round(x*100)+'%'}
function norm(s){return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseVal(s){if(typeof s==='number')return s;s=(s||'').toString().replace(/[^\d,.-]/g,'');if(!s)return NaN;
  if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}
  return parseFloat(s)}
function mesLabel(m){const[y,mm]=m.split('-');return MESES[+mm-1]+' '+y}
function addMes(m,k){const[y,mm]=m.split('-').map(Number);return ym(new Date(y,mm-1+k,1))}
function dLabel(d){const[y,m,dd]=d.split('-');const dt=new Date(+y,+m-1,+dd);return dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cor(p){return p==='Dai'?'var(--dai)':'var(--alex)'}
function outro(p){return p==='Dai'?'Alex':'Dai'}

/* ===================== dados ===================== */
let _entCache=null;
function entries(){if(_entCache)return _entCache;return _entCache=entries0()}
function entries0(){
  const ov={},out=[];
  for(const t of S.tx) if(t.ref) ov[t.ref]=t;
  for(const [mes,doc] of Object.entries(S.hist)){
    (doc.items||[]).forEach((a,i)=>{if(!Array.isArray(a))a=[a.d,a.v,a.p,a.l,a.t,a.cd];const id='h:'+mes+':'+i;const o=ov[id];
      if(o){if(!o.del)out.push({...o,l:aliasL(o.l),t:resolveCat(o.t),id:o._id,mes:o.mes||mes,src:'planilha'})}
      else out.push({id,d:a[0],v:a[1],p:a[2],l:aliasL(a[3]),t:resolveCat(a[4]),cd:a[5],mes,src:'planilha'})});
  }
  for(const t of S.tx) if(!t.ref) out.push({...t,l:aliasL(t.l),t:resolveCat(t.t),id:t._id});
  return out;
}
function doMes(all,m){return all.filter(e=>e.mes===m).sort((a,b)=>b.d.localeCompare(a.d)||(b.at||0)-(a.at||0))}
function resumo(list){
  let tot=0,cDai=0,pDai=0,pAlex=0,cats={};
  for(const e of list){
    const v=+e.v||0,cd=+e.cd||0;
    cDai+=v*cd; if(e.p==='Dai')pDai+=v; else pAlex+=v;
    if(e.t!=='Acerto'){tot+=v;cats[e.t]=(cats[e.t]||0)+v}
  }
  const cAlex=list.reduce((s,e)=>s+(+e.v||0)*(1-(+e.cd||0)),0);
  return {tot,cDai,cAlex,pDai,pAlex,saldoDai:pDai-cDai,cats};
}
function buildIndex(all){
  const m={};
  const sorted=[...all].filter(e=>e.t!=='Acerto').sort((a,b)=>a.d.localeCompare(b.d));
  const lim=ym(new Date(Date.now()-120*864e5));
  for(const e of sorted){const k=norm(e.l);if(!k||k==='—')continue;
    const r=m[k]||(m[k]={k,nome:e.l,n:0,rec:0,cats:{},vals:[],sp:{},hist:[]});
    r.n++; if(e.mes>=lim)r.rec++; r.sp[e.l]=(r.sp[e.l]||0)+1; r.last=e; r.cats[e.t]=(r.cats[e.t]||0)+1; r.vals.push(+e.v); r.hist.push(e);
  }
  const mode=a=>{const c={};let b=null,bn=0;for(const x of a){c[x]=(c[x]||0)+1;if(c[x]>=bn){bn=c[x];b=x}}return b};
  for(const r of Object.values(m)){
    r.nome=Object.entries(r.sp).sort((a,b)=>b[1]-a[1]||(/[A-Z]{2}/.test(a[0])?1:-1))[0][0];
    const rec=r.hist.slice(-8);r.t=mode(rec.map(e=>e.t));r.cd=+mode(rec.filter(e=>e.t===r.t).map(e=>String(e.cd)));
    const o=lugCfg()[kk(r.k)];if(o){if(o.t)r.t=resolveCat(o.t);if(o.cd!=null&&o.cd!=='')r.cd=+o.cd;r.oculto=!!o.oculto;r.fix=true}
    r.tot=r.vals.reduce((a,b)=>a+b,0);r.score=r.rec*3+r.n*.3;r.toks=r.k.split(' ');delete r.hist}
  return Object.values(m);

function sugerir(q,n=6){
  if(!IDX)return[];const nq=norm(q);const BASE=IDX.filter(r=>!r.oculto);
  if(!nq)return [...BASE].sort((a,b)=>b.score-a.score).slice(0,n);
  const qt=nq.split(' ').filter(Boolean);
  return BASE.map(r=>{let s=0;
    if(r.k===nq)s+=200; else if(r.k.startsWith(nq))s+=120;
    for(const w of qt){ if(r.toks.some(t=>t.startsWith(w)))s+=50; else if(w.length>=3&&r.k.includes(w))s+=25; else s-=40; }
    return {r,s:s+Math.min(r.score,40)}}).filter(x=>x.s>40).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.r);

function casarComerciante(raw){
  const nq=norm(raw);if(!nq||!IDX)return null;
  const qt=nq.split(' ').filter(w=>w.length>=3&&!/^(com|ind|ltda|sa|me|eireli|comercio|loja|br|poa|porto|alegre)$/.test(w));
  const GEN=/^(posto|auto|bar|restaurante|super|supermercado|mercado|farmacia|padaria|lanchonete|cafe|casa|center|shopping|centro|sul|rs)$/;
  let best=null,bs=0;
  for(const r of IDX){let s=0,strong=0;
    for(const w of qt){ if(r.toks.includes(w)){s+=10;if(!GEN.test(w))strong++} else if(r.toks.some(t=>t.length>=4&&(t.startsWith(w)||w.startsWith(t)))){s+=6;if(!GEN.test(w))strong++} }
    if(s===0||!strong)continue; s+=Math.min(r.score,20)/10 - Math.abs(r.toks.length-qt.length)*.5;
    if(s>bs){bs=s;best=r}}
  return bs>=6?best:null;
}

async function salvarLugar(){

   ${F.retroOn?`<div style="display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:8px"><span class="hint" style="margin:0">desde</span><input class="inp" type="month" id="fretro" value="${F.retroDe||addMes((F.d||today()).slice(0,7),-1)}" style="min-width:0"></div><div class="hint" id="fretroinfo">${retroInfo()}</div>`:''}</div>`:''}
  <div class="actions">${F.pend?`<button class="btn bad" data-act="recusar">Recusar</button><button class="btn light" data-act="close">Depois</button><button class="btn" data-act="salvar">Aceitar</button>`:
   F.id?`<button class="btn bad" data-act="excluir">Excluir</button><button class="btn" data-act="salvar">Salvar</button>`:`<button class="btn" data-act="salvar">Lançar</button>`}</div>`;
  const fv=document.getElementById('fv');fv.oninput=()=>{F.v=fv.value;updSplit()};
  const fl=document.getElementById('fl');if(fl){fl.oninput=()=>{F.l=fl.value;F.sug=null;const pos=fl.selectionStart;drawForm(false);const n=document.getElementById('fl');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  const fcd=document.getElementById('fcd');if(fcd)fcd.oninput=()=>{F.cd=fcd.value/100;F.autoCd=false;updSplit(true)};
  document.getElementById('fd').onchange=e=>{F.d=e.target.value;const i=document.getElementById('fretroinfo');if(i)i.innerHTML=retroInfo()};
  const fr=document.getElementById('fretro');if(fr)fr.onchange=()=>{F.retroDe=fr.value;document.getElementById('fretroinfo').innerHTML=retroInfo()};
  if(document.getElementById('fretroinfo')){const upd=()=>{const i=document.getElementById('fretroinfo');if(i)i.innerHTML=retroInfo()};fv.addEventListener('input',upd)}
  if(focus)setTimeout(()=>fv.focus(),280);
}
function updSplit(chips){
  const v=parseVal(F.v)||0,cd=F.cd;const sb=document.querySelector('.splitbar');if(!sb)return;
  sb.firstElementChild.style.width=(cd*100)+'%';
  const sl=document.querySelector('.splitlbl');sl.innerHTML=`<span>Dai ${pct(cd)} · ${brl(v*cd)}</span><span>Alex ${pct(1-cd)} · ${brl(v*(1-cd))}</span>`;
  if(chips)document.querySelectorAll('[data-act=cd]').forEach(b=>b.classList.toggle('on',Math.abs(cd-+b.dataset.x)<.001));
}
function closeSheet(){document.getElementById('scrim').classList.remove('on');document.getElementById('sheet').classList.remove('on');F=null}
function retroPlano(){
  if(!F||!F.retroOn)return {meses:[],pular:[]};const d=F.d||today();const ate=addMes(d.slice(0,7),-1);const de=F.retroDe||ate;
  if(de>ate)return {meses:[],pular:[]};const todos=mesesEntre(de,ate).slice(-36);const nl=norm(F.l);const all=entries();
  const pular=todos.filter(m=>nl&&all.some(e=>e.mes===m&&norm(e.l)===nl));return {meses:todos.filter(m=>!pular.includes(m)),pular};
}
function retroInfo(){const {meses,pular}=retroPlano();const v=parseVal(F.v)||0;
  if(!meses.length&&!pular.length)return 'Escolha um mês anterior à data do lançamento.';
  return `${meses.length===1?'Será criado':'Serão criados'} <b>${meses.length}</b> lançamento${meses.length===1?'':'s'} extra${meses.length===1?'':'s'} (${meses.length?mesLabel(meses[0])+' → '+mesLabel(meses[meses.length-1]):'nenhum'}), total <b>${brl(v*meses.length)}</b>, no mesmo dia do mês.${pular.length?` Pulando ${pular.length} ${pular.length>1?'meses que já têm':'mês que já tem'} “${esc(F.l)}”: ${pular.map(m=>MESES[+m.slice(5)-1].slice(0,3)+'/'+m.slice(2,4)).join(', ')}.`:''}`}
async function salvar(){
  const v=parseVal(F.v);
  if(!(v>0)){toast('Informe o valor.');return}
  if(!F.acerto&&!F.l.trim()){toast('Informe onde foi o gasto.');return}
    const d=F.d||today();
  const data={d,mes:d.slice(0,7),v:Math.round(v*100)/100,p:F.p,l:F.acerto?('Acerto '+F.p+' → '+outro(F.p)):F.l.trim(),t:F.acerto?'Acerto':F.t,cd:F.acerto?(F.p==='Alex'?1:0):Math.round(F.cd*1000)/1000,src:F.src||'manual',by:S.me||'',at:Date.now()};
  if(F.pend)data.pid=F.pend._id;
  try{
    if(F.isHist&&!F.txId){const[,mes,i]=F.id.split(':');data.ref=F.id;await saveTx('o-'+mes+'-'+i,data)}
    else if(F.txId){const old=S.tx.find(t=>t._id===F.txId);if(old&&old.ref)data.ref=old.ref;await saveTx(F.txId,data)}
    else await saveTx(null,data);
    if(F.pend)await delPend(F.pend._id);
    const plano=(!F.id&&!F.pend&&!F.acerto)?retroPlano().meses:[];let n=0;
    if(plano.length){const dia=+d.slice(8,10);for(const mm of plano){const [yy,mo]=mm.split('-').map(Number);const ult=new Date(yy,mo,0).getDate();const dd=mm+'-'+String(Math.min(dia,ult)).padStart(2,'0');
      await saveTx(null,{...data,d:dd,mes:mm,src:'retro',at:Date.now()});n++;toast('Lançando meses anteriores… '+n+'/'+plano.length)}}
    const m=data.mes;closeSheet();if(m!==S.mes){S.mes=m}render();toast(n?`Salvo ✓ + ${n} ${n>1?'meses anteriores':'mês anterior'}`:'Salvo ✓');
  }catch(e){}
}
async function excluir(){
  if(!F||!F.id)return;const b=document.querySelector('[data-act=excluir]');
  if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar exclusão';return}
  try{
    if(F.isHist&&!F.txId){const[,mes,i]=F.id.split(':');await saveTx('o-'+mes+'-'+i,{ref:F.id,del:true,mes,d:mes+'-01',at:Date.now()})}
    else{const old=S.tx.find(t=>t._id===F.txId);if(old&&old.ref)await saveTx(F.txId,{ref:old.ref,del:true,mes:old.mes,d:old.d,at:Date.now()});else await delTx(F.txId)}
    closeSheet();toast('Excluído');
  }catch(e){}
}
function askMe(){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="grab"></div><h3>Quem está usando este celular?</h3><p class="hint" style="margin-bottom:12px">Assim o app já marca quem pagou em cada lançamento e captura.</p>
  <div class="actions">${['Dai','Alex'].map(p=>`<button class="btn" style="background:${p==='Dai'?'#e0663f':'#3a6ad6'}" data-act="setme" data-p="${p}">Sou ${p}</button>`).join('')}</div>`;

/* ===================== FINANÇAS (receitas, compromissos, empréstimos) ===================== */
const FIN_WS=['dai','alex'];const FIN_NOME={dai:'Dai',alex:'Alex'};
function finColW(w){return w==='dai'?'fin':'fin_'+w}
function finCfgW(w){return w==='dai'?'cfg/fin':'cfg/fin_'+w}
function setW(w){S.fin=S.fins[w]}
const FIN_TIPOS=['Empréstimo','Financiamento','Cartão','Banco','Moradia','Contas','Diversos'];
const FIN_EMO={'Empréstimo':'🏦','Financiamento':'🏦','Cartão':'💳','Banco':'🏛️','Moradia':'🏠','Contas':'🧾','Diversos':'🛍️'};
function fcfg(){return S.fin.cfg||{titulo:'Finanças',inicio:ym(new Date()),saldoInicial:0,fontes:[],itens:[]}}
function inRange(m,de,ate){return (!de||m>=de)&&(!ate||m<=ate)}
function recItens(m,f){const d=S.fin.meses[m];const l=d&&d.recItens&&d.recItens[f.id];return Array.isArray(l)?l:[]}
function fRec(m,f){const d=S.fin.meses[m];const it=recItens(m,f);if(it.length)return it.reduce((a,x)=>a+(+x.v||0),0);if(d&&d.rec&&d.rec[f.id]!=null)return +d.rec[f.id];return (+f.padrao&&inRange(m,f.de,f.ate))?+f.padrao:0}
function fComp(m,i){const d=S.fin.meses[m];const c=d&&d.comp&&d.comp[i.id];if(c&&c.v!=null)return {v:+c.v,ok:!!c.ok,prev:false};return {v:(+i.padrao&&inRange(m,i.de,i.ate))?+i.padrao:0,ok:false,prev:true}}
function finMes(m){const c=fcfg();let rec=0,comp=0,pago=0;for(const f of c.fontes)rec+=fRec(m,f);for(const i of c.itens){const x=fComp(m,i);comp+=x.v;if(x.ok)pago+=x.v}return{rec,comp,pago,aberto:comp-pago}}
function finSaldos(ate){const c=fcfg();const ac=c.acumula!==false;const out={};let s=+c.saldoInicial||0;let m=c.inicio||ym(new Date());let k=0;while(m<=ate&&k++<360){const r=finMes(m);const ini=ac?s:0;s=ini+r.rec-r.comp;out[m]={ini,fim:s,...r,ac};m=addMes(m,1)}return out}
function finHorizonte(){let h=addMes(ym(new Date()),36);for(const k of Object.keys(S.fin.meses))if(k>h)h=k;for(const i of fcfg().itens)if(i.ate&&i.ate>h)h=i.ate;return h}
function finChips(){const w=S.fw;return `<div class="seg" style="margin-bottom:12px;grid-template-columns:1fr 1fr 1fr">${[['dai','Dai'],['alex','Alex'],['all','Juntos']].map(([k,t])=>`<button class="${w===k?'on':''}" data-act="fw" data-w="${k}">${t}</button>`).join('')}</div>`}
function viewFin(){
  if(!S.fw)S.fw=(S.me==='Alex'?'alex':'dai');
  if(S.fw==='all')return viewFinAll();
  setW(S.fw);return finChips()+viewFinW();
}
function viewFinAll(){
  const m=S.fmes||(S.fmes=ym(new Date()));let h=finChips()+`<div class="mnav"><button data-act="fprev">‹</button><b>${mesLabel(m)}</b><button data-act="fnext">›</button></div>`;
  const por={};let fim=0,rec=0,comp=0,pago=0;const fut=[];const proj=Array(12).fill(0);
  for(const w of FIN_WS){setW(w);if(!S.fin.cfg&&!Object.keys(S.fin.meses).length){por[w]=null;continue}
    const H=finHorizonte();const sal=finSaldos(H>addMes(m,12)?H:addMes(m,12));const r=sal[m]||{ini:0,fim:0,ac:fcfg().acumula!==false,...finMes(m)};por[w]=r;
    fim+=r.fim;rec+=r.rec;comp+=r.comp;pago+=r.pago;for(let k=0;k<12;k++){const x=sal[addMes(m,k)];proj[k]+=x?x.fim:0}
    const meses=[];let m2=m;while(m2<=H){meses.push(m2);m2=addMes(m2,1)}
    for(const i of fcfg().itens){let rest=0,n=0,ult=null;for(const mm of meses){const x=fComp(mm,i);if(x.v>0&&!x.ok){rest+=x.v;n++;ult=mm}}if(rest>0)fut.push({w,i,rest,n,ult})}}
  setW(S.fw==='all'?'dai':S.fw);
  h+=`<div class="card hero"><div class="lbl">Dai + Alex · ${Object.values(por).some(r=>r&&!r.ac)?'resultado':'saldo'} ao fim do mês</div><div class="big" style="color:${fim<0?'var(--bad)':'inherit'}">${brl(fim)}</div>
   <div class="split">${FIN_WS.map(w=>{const r=por[w];return `<button class="who" data-act="fw" data-w="${w}" style="text-align:left;font:inherit"><div class="n"><i style="background:${cor(FIN_NOME[w])}"></i>${FIN_NOME[w]}</div>${r?`<div class="row"><span>${r.ac?'Saldo':'Resultado'}</span><span style="color:${r.fim<0?'var(--bad)':'inherit'}">${brl(r.fim)}</span></div><div class="row"><span>Receitas</span><span>${brl(r.rec)}</span></div><div class="row"><span>Compr.</span><span>${brl(r.comp)}</span></div>`:'<div class="row"><span>sem dados</span><span></span></div>'}</button>`}).join('')}</div>
   <div class="who" style="margin-top:10px;background:#faf9f6"><div class="row"><span>Receitas juntas</span><span style="color:#1f6b45">${brl(rec)}</span></div><div class="row"><span>Compromissos juntos</span><span style="color:var(--bad)">${brl(comp)}</span></div><div class="row"><span>Já pago</span><span>${brl(pago)}</span></div><div class="row"><span>Em aberto</span><span>${brl(comp-pago)}</span></div></div></div>`;
  fut.sort((a,b)=>b.rest-a.rest);const tot=fut.reduce((a,x)=>a+x.rest,0);const totW=w=>fut.filter(x=>x.w===w).reduce((a,x)=>a+x.rest,0);
  h+=`<div class="sec"><h2>Dívidas e parcelas a pagar</h2><span>${brl(tot)}</span></div><div class="card"><div class="hint" style="margin-bottom:6px">Dai: <b>${brl(totW('dai'))}</b> · Alex: <b>${brl(totW('alex'))}</b></div>`+(fut.length?fut.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f2f0ea"><div><b><span class="dot" style="background:${cor(FIN_NOME[x.w])}"></span>${esc(x.i.nome)}</b><br><small style="color:var(--ink2)">${FIN_NOME[x.w]} · ${x.n} ${x.n>1?'parcelas':'parcela'} · até ${mesLabel(x.ult)}</small></div><b style="white-space:nowrap">${brl(x.rest)}</b></div>`).join(''):'<div class="empty">Nenhuma dívida futura.</div>')+`</div>`;
  const pm=[];for(let k=0;k<12;k++)pm.push(addMes(m,k));
  h+=projChart(pm,proj,'Dai + Alex · próximos 12 meses');
  return h;
}
function projChart(pm,vals,titulo){
  const W=340,Hh=170,pb=22,bw=W/12,mn=Math.min(0,...vals),top=Math.max(0,...vals);const rng=(top-mn)||1;const y0=10+(top/rng)*(Hh-pb-10);
  return `<div class="card chart" style="margin-top:12px"><div style="font-weight:800">Projeção · ${esc(titulo)}</div><div class="hint">Com base nas receitas e compromissos já lançados ou previstos.</div>
  <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Projeção do saldo"><line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#cfcac0"/>
  ${vals.map((v,k)=>{const bh=Math.abs(v)/rng*(Hh-pb-10);const x=k*bw+bw*.2,w=bw*.6;const y=v>=0?y0-bh:y0;return `<g data-act="bar" data-l="${mesLabel(pm[k])}" data-v="${v}"><rect x="${k*bw}" y="0" width="${bw}" height="${Hh}" fill="transparent"/><rect x="${x}" y="${y}" width="${w}" height="${Math.max(bh,1)}" rx="3" fill="${v<0?'#d9776b':k===0?'#1f5f4a':'#9fbfb2'}"/><text x="${k*bw+bw/2}" y="${Hh-6}" text-anchor="middle" font-size="10" fill="#8f938b" font-family="Manrope">${MESES[+pm[k].slice(5)-1].slice(0,3)}</text></g>`}).join('')}
  </svg><div class="tip" id="tip">Toque numa barra para ver o valor.</div></div>`;
}
function viewFinW(){
  const c=fcfg();const m=S.fmes||(S.fmes=ym(new Date()));
  if(!S.fin.cfg&&!Object.keys(S.fin.meses).length){
    return `<div class="card set" style="margin-top:20px"><h4>💰 Finanças</h4><p>Controle de receitas, empréstimos, cartões e demais compromissos, com o saldo passando de um mês para o outro.</p>
    <p>Ainda não há dados de <b>${FIN_NOME[S.fw]}</b>. Para trazer os dados da aba <b>Controle Dívidas</b> da planilha, vá em <b>Ajustes → Histórico da planilha → Importar</b> e escolha <b>financas-e-alugueis.json</b>.</p>
    <button class="btn sm" data-act="finicio">Começar do zero</button></div>`}

  const doc=S.fin.meses[m]||{};

   <div class="who" style="background:#faf9f6">${r.ac===false?'':`<div class="row"><span>Saldo anterior</span><span>${brl(r.ini)}</span></div>`}<div class="row"><span>+ Receitas</span><span style="color:#1f6b45">${brl(r.rec)}</span></div><div class="row"><span>− Compromissos</span><span style="color:var(--bad)">${brl(r.comp)}</span></div></div>
   <div class="split" style="margin-top:10px"><div class="who"><div class="n">✓ Pago</div><div class="row"><span></span><span>${brl(r.pago)}</span></div></div><div class="who"><div class="n">⏳ Em aberto</div><div class="row"><span></span><span>${brl(r.aberto)}</span></div></div></div>
   <div class="hint" style="margin-top:10px">${doc.obs?'📝 '+esc(doc.obs)+' · ':''}<a href="#" data-act="fobs" style="color:var(--acc);font-weight:700">${doc.obs?'editar anotação':'+ anotação do mês'}</a></div></div>`;
  // receitas
  h+=`<div class="sec"><h2>Receitas</h2><span>${brl(r.rec)}</span></div><div class="list">`+(c.fontes.length?c.fontes.map(f=>{const v=fRec(m,f);const d=S.fin.meses[m];const prev=!(d&&d.rec&&d.rec[f.id]!=null)&&v>0;
    return `<button class="it" data-act="fval" data-k="rec" data-id="${esc(f.id)}"><div class="ic">💵</div><div class="x"><b>${esc(f.nome)}</b><small>${recItens(m,f).length?recItens(m,f).map(x=>esc(x.nome||'—')+' '+brl(x.v)).join(' · '):prev?'previsto (padrão)':v?'lançado':'sem valor neste mês'}</small></div><div class="v" style="color:${v?'#1f6b45':'var(--mute)'}">${brl(v)}</div></button>`}).join(''):'<div class="empty">Nenhuma fonte de receita. Toque em Configurar.</div>')+`</div>`;
  // compromissos
  const itens=c.itens.map(i=>({i,...fComp(m,i)}));const vis=itens.filter(x=>x.v>0);const ocultos=itens.length-vis.length;
  const lista=S.fall?itens:vis;const grupos={};for(const x of lista)(grupos[x.i.tipo||'Diversos']=grupos[x.i.tipo||'Diversos']||[]).push(x);
  h+=`<div class="sec"><h2>Compromissos</h2><span>${brl(r.comp)}</span></div>`;
  if(!lista.length)h+=`<div class="list"><div class="empty">Nada a pagar neste mês.</div></div>`;
  for(const [t,xs] of Object.entries(grupos)){
    h+=`<div class="day">${FIN_EMO[t]||'•'} ${esc(t)} · ${brl(xs.reduce((a,x)=>a+x.v,0))}</div><div class="list">`+xs.map(x=>`<div class="it" style="padding:10px 12px">
      <button data-act="fok" data-id="${esc(x.i.id)}" aria-label="Marcar como pago" style="width:34px;height:34px;border-radius:50%;border:2px solid ${x.ok?'#1f6b45':'#d6d3cb'};background:${x.ok?'#1f6b45':'#fff'};color:#fff;font-weight:800;flex:0 0 auto" ${x.v?'':'disabled'}>${x.ok?'✓':''}</button>
      <button data-act="fval" data-k="comp" data-id="${esc(x.i.id)}" style="all:unset;flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0"><div class="x"><b style="${x.ok?'text-decoration:line-through;color:var(--mute)':''}">${esc(x.i.nome)}</b><small>${x.i.dia?'vence dia '+x.i.dia+' · ':''}${x.ok?'pago':x.prev&&x.v?'previsto':x.v?'a pagar':'—'}</small></div><div class="v">${brl(x.v)}</div></button></div>`).join('')+`</div>`;
  }
  if(ocultos)h+=`<button class="btn light sm" data-act="fall" style="margin-top:8px">${S.fall?'Esconder itens sem valor':'Mostrar todos ('+ocultos+' sem valor neste mês)'}</button>`;
  // empréstimos e dívidas
  const fut=[];let m2=m;const meses=[];while(m2<=H){meses.push(m2);m2=addMes(m2,1)}
  for(const i of c.itens){let rest=0,n=0,ult=null;for(const mm of meses){const x=fComp(mm,i);if(x.v>0&&!x.ok){rest+=x.v;n++;ult=mm}}if(rest>0)fut.push({i,rest,n,ult})}
  fut.sort((a,b)=>b.rest-a.rest);const totFut=fut.reduce((a,x)=>a+x.rest,0);
  h+=`<div class="sec"><h2>Dívidas e parcelas a pagar</h2><span>a partir deste mês</span></div><div class="card">`+(fut.length?`<div class="hint" style="margin-bottom:6px">Total ainda a pagar: <b>${brl(totFut)}</b></div>`+fut.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f2f0ea"><div><b>${FIN_EMO[x.i.tipo]||'•'} ${esc(x.i.nome)}</b><br><small style="color:var(--ink2)">${x.n} ${x.n>1?'parcelas':'parcela'} · termina em ${mesLabel(x.ult)}</small></div><b style="white-space:nowrap">${brl(x.rest)}</b></div>`).join(''):'<div class="empty">Nenhuma dívida futura lançada.</div>')+`</div>`;
  const pm=[];for(let k=0;k<12;k++)pm.push(addMes(m,k));h+=projChart(pm,pm.map(x=>sal[x]?sal[x].fim:0),c.acumula===false?'resultado de cada mês':'saldo');
  h+=`<button class="btn light" data-act="fcfg" style="width:100%;margin-top:12px">⚙️ Configurar receitas e compromissos</button>`;

function aluItens(im,m){const d=aluDoc(im,m);if(d)return {itens:d.itens||[],prev:false};const ok=inRange(m,im.desde,im.ate)&&im.ativo;
  return {itens:ok?(im.itensPadrao||[]).filter(x=>inRange(m,x.de,x.ate)&&+x.v).map(x=>({nome:x.nome,v:+x.v})):[],prev:true}}
function aluResumo(im,m){const d=aluDoc(im,m);const {itens,prev}=aluItens(im,m);const tot=itens.reduce((a,x)=>a+(+x.v),0);const pag=(d&&d.pag)||[];const pago=pag.reduce((a,x)=>a+(+x.v),0);

  return h;

async function excluirAluPag(id){const im=imAtual();const r=aluResumo(im,S.amesA);const p=r.pag.find(x=>x.id===id);if(!p)return;
  const b=document.querySelector(`[data-act=apagdel][data-id="${id}"]`);if(b&&!b.dataset.c){b.dataset.c=1;b.textContent='Excluir?';return}
  try{if(p.tx&&p.tx!=='planilha'){await S.db.collection('tx').doc(p.tx).delete()}
    await setAluDoc(im,S.amesA,d=>{d.pag=(d.pag||[]).filter(x=>x.id!==id)});toast(p.tx&&p.tx!=='planilha'?'Pagamento excluído (e removido de Contas)':'Pagamento excluído')}catch(e){dbErr(e)}}
function viewAluCfg(){
  const l=S.aluDraft||JSON.parse(JSON.stringify(acfg().imoveis));
  return `<div class="mnav"><button data-act="tab" data-t="alu">‹</button><b style="font-size:20px">Imóveis</b><span style="width:40px"></span></div>`+
  l.map((im,i)=>`<div class="card set acf" data-i="${i}" data-id="${esc(im.id)}"><div style="display:grid;grid-template-columns:1fr 34px;gap:6px"><input class="inp" data-k="nome" value="${esc(im.nome)}" placeholder="Nome do imóvel"><button class="btn bad sm" data-act="acfgdel" data-i="${i}" data-j="" style="padding:8px 0">✕</button></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><label class="hint" style="margin:0;min-width:0">Início<input class="inp" type="month" data-k="desde" value="${im.desde||''}" style="min-width:0"></label><label class="hint" style="margin:0;min-width:0">Fim (se encerrou)<input class="inp" type="month" data-k="ate" value="${im.ate||''}" style="min-width:0"></label>
   <label class="hint" style="margin:0">Dia de vencimento<input class="inp" data-k="dia" inputmode="numeric" value="${im.dia||''}"></label><label class="hint" style="margin:0">% da Dai em Contas<input class="inp" data-k="cd" inputmode="numeric" value="${Math.round((im.cd??.6)*100)}"></label></div>
   <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600"><input type="checkbox" data-k="ativo" ${im.ativo?'checked':''} style="width:20px;height:20px;accent-color:var(--acc)"> Imóvel atual (gera os meses automaticamente)</label>
   <div class="hint" style="margin-top:10px;font-weight:700">Valores padrão de cada mês</div>
   ${(im.itensPadrao||[]).map((x,j)=>`<div class="aip" style="display:grid;grid-template-columns:1fr 92px 34px;gap:6px;margin-top:6px"><input class="inp" data-k="n" value="${esc(x.nome)}" placeholder="Item" style="padding:9px 8px;min-width:0"><input class="inp" data-k="v" inputmode="decimal" value="${String(x.v??'').replace('.',',')}" placeholder="Valor" style="padding:9px 8px"><button class="btn bad sm" data-act="acfgdel" data-i="${i}" data-j="${j}" style="padding:8px 0">✕</button><input class="inp" type="month" data-k="ate" value="${x.ate||''}" title="Até (opcional)" style="padding:6px 8px;grid-column:1/3;min-width:0;font-size:14px"></div>`).join('')}
   <button class="btn light sm" data-act="acfgadd" data-k="it" data-i="${i}" style="margin-top:8px">+ Item padrão</button></div>`).join('')+
  `<button class="btn light" data-act="acfgadd" data-k="im" style="width:100%">+ Imóvel</button><button class="btn" data-act="acfgsave" style="width:100%;padding:14px;margin-top:10px">Salvar imóveis</button>`;
}
function readAluCfg(){return [...document.querySelectorAll('.acf')].map(r=>{const g=k=>{const e=r.querySelector(`:scope > div [data-k=${k}], :scope > label [data-k=${k}], :scope > div > label [data-k=${k}]`);return e?(e.type==='checkbox'?e.checked:e.value.trim()):''};
  const o={id:r.dataset.id,nome:g('nome'),desde:g('desde'),ate:g('ate'),dia:parseInt(g('dia'))||10,cd:Math.min(100,Math.max(0,parseFloat(g('cd'))||0))/100,ativo:!!g('ativo'),
   itensPadrao:[...r.querySelectorAll('.aip')].map(a=>{const x={nome:a.querySelector('[data-k=n]').value.trim(),v:parseVal(a.querySelector('[data-k=v]').value)||0};const at=a.querySelector('[data-k=ate]').value;if(at)x.ate=at;return x})};
  if(!o.ate)delete o.ate;if(!o.desde)delete o.desde;return o})}
async function salvarAluCfg(){const l=readAluCfg().filter(x=>x.nome).map(x=>({...x,itensPadrao:x.itensPadrao.filter(i=>i.nome)}));
  try{await S.db.doc('cfg/alu').set({imoveis:l});S.aluDraft=null;S.tab='alu';toast('Imóveis salvos ✓');render()}catch(e){dbErr(e)}}

/* ===================== eventos ===================== */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act],[data-tab]');if(!b)return;
  if(b.tagName==='A')ev.preventDefault();
  if(b.dataset.tab){S.tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  const a=b.dataset.act;const all=()=>entries();
  switch(a){
    case 'prev':S.mes=addMes(S.mes,-1);render();break;
    case 'next':S.mes=addMes(S.mes,1);render();break;
    case 'close':closeSheet();break;
    case 'setme':setMe(b.dataset.p);break;
    case 'edit':{const e=all().find(x=>x.id===b.dataset.id);if(e)openForm({edit:e});break}
    case 'rev':{const p=S.pend.find(x=>x._id===b.dataset.id);if(p)openForm({pend:p});break}
    case 'sug':{const r=IDX.find(x=>x.k===b.dataset.k);if(r){applySug(r);drawForm(false);if(!(parseVal(F.v)>0))document.getElementById('fv').focus()}break}
    case 'cat':F.t=b.dataset.c;if(F.autoCd)F.cd=cotaCat(F.t);drawForm(false);break;
    case 'payer':F.p=b.dataset.p;drawForm(false);break;
    case 'cd':F.cd=+b.dataset.x;F.autoCd=false;updSplit(true);document.getElementById('fcd').value=Math.round(F.cd*100);break;
    case 'salvar':salvar();break;
    case 'excluir':excluir();break;
    case 'recusar':{const id=F.pend._id;closeSheet();await delPend(id);toast('Descartado');break}
    case 'goacertos':S.tab='acertos';render();window.scrollTo(0,0);break;
    case 'acano':S.acAno=b.dataset.y;render();break;
    case 'acmes':S.mes=b.dataset.m;S.tab='mes';render();window.scrollTo(0,0);break;
    case 'acinicio':{const v=document.getElementById('acini').value;if(v){await saveCfg({...(S.cfg||{}),acertoInicio:v});toast('Início da contagem salvo ✓')}break}
    case 'acertototal':{const q=quadroAcertos();const a=q.acum;openForm({acerto:true,v:Math.abs(a).toFixed(2).replace('.',','),focus:false});F.p=a>0?'Alex':'Dai';F.d=today();drawForm(false);break}
    case 'virarAcerto':{const v=F.v,d=F.d;openForm({acerto:true,v,focus:false});F.d=d;F.p=S.me||'Dai';drawForm(false);break}
    case 'acerto':{const r=resumo(doMes(all(),S.mes));const quem=r.saldoDai>0?'Alex':'Dai';
      openForm({acerto:true,v:Math.abs(r.saldoDai).toFixed(2).replace('.',','),focus:false});F.p=quem;F.d=S.mes===ym(new Date())?today():S.mes+'-28';drawForm(false);break}
    case 'fixa':{const list=doMes(all(),S.mes);const f=fixasStatus(list,S.mes)[+b.dataset.i];
      if(f.st==='ok'&&f.hits.length===1){openForm({edit:f.hits[0]});break}
      openForm({l:f.nome,t:f.t,cd:f.cd,v:String(f.v).replace('.',','),focus:false});F.d=S.mes===ym(new Date())?today():S.mes+'-'+String(Math.min(f.dia,28)).padStart(2,'0');drawForm(false);break}
    case 'bar':document.getElementById('tip').innerHTML=`<b>${esc(b.dataset.l)}</b>: ${brl(+b.dataset.v)}`;break;
    case 'amode':S.tab='analise';S.amode=b.dataset.m;S.acat=null;if(S.amode==='ano')S.ano=S.mes.slice(0,4);render();break;
    case 'per':{const k=b.dataset.k;const P=S.per||{};const a=P.ano||ym(new Date()).slice(0,4);
      if(k==='s1'||k==='s2')S.per={tipo:'s',ano:a,sem:k==='s1'?1:2};else if(k[0]==='u')S.per={tipo:'u',n:+k.slice(1),ano:a};else{const pa=periodoAtual();S.per={tipo:'c',de:pa.ms[0],ate:pa.ms[pa.ms.length-1],ano:a}}
      render();break}
    case 'pprev':{const P=S.per;if(P.sem===2)P.sem=1;else{P.sem=2;P.ano=String(+P.ano-1)}render();break}
    case 'pnext':{const P=S.per;if(P.sem===1)P.sem=2;else{P.sem=1;P.ano=String(+P.ano+1)}render();break}
    case 'yprev':S.ano=String(+S.ano-1);S.acat=null;render();break;
    case 'ynext':S.ano=String(+S.ano+1);S.acat=null;render();break;
    case 'acat':S.acat=b.dataset.c||null;render();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'catup':{const l=readCats();const i=+b.dataset.i;if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];S.catDraft=l;render()}break}
    case 'catadd':{const l=readCats();l.push({nome:'',e:'•',cd:.5,_novo:1});S.catDraft=l;render();setTimeout(()=>{const x=document.querySelectorAll('.cate [data-k=nome]');x[x.length-1]?.focus()},50);break}
    case 'catdel':{const l=readCats();S.catDraft=l;abrirExcluirCat(+b.dataset.i);break}
    case 'catdelok':confirmarExcluirCat();break;
    case 'catsave':salvarCats();break;
    case 'bsel':S.bsel={k:b.dataset.k,v:b.dataset.v,label:b.dataset.label||b.dataset.v};S.tab='busca';render();window.scrollTo(0,0);break;
    case 'bvoltar':S.tab='mes';render();break;
    case 'smtoggle':S.smOpen=!S.smOpen;render();break;
    case 'gofin':S.tab='fin';S.fw=S.me==='Dai'?'dai':'alex';S.fmes=S.mes;render();window.scrollTo(0,0);toast(b.title||'');break;
    case 'retro':F.retroOn=!F.retroOn;drawForm(false);break;
    case 'fw':S.fw=b.dataset.w;S.fall=false;render();window.scrollTo(0,0);break;
    case 'fprev':S.fmes=addMes(S.fmes,-1);render();break;
    case 'fnext':S.fmes=addMes(S.fmes,1);render();break;
    case 'fval':abrirFinVal(b.dataset.k,b.dataset.id);break;
    case 'fvalsave':salvarFinVal();break;
    case 'fcliadd':{document.getElementById('fclis').insertAdjacentHTML('beforeend',cliRow('',''));const l=document.querySelectorAll('.fcli [data-k=n]');l[l.length-1].focus();break}
    case 'fclidel':{b.closest('.fcli').remove();atualizaCliTot();break}
    case 'fok':toggleFinOk(b.dataset.id);break;
    case 'fobs':abrirFinObs();break;
    case 'fobssave':salvarFinObs();break;
    case 'fall':S.fall=!S.fall;render();break;
    case 'fcfg':S.tab='fincfg';S.finDraft=null;render();window.scrollTo(0,0);break;
    case 'fcfgadd':{const d=readFinCfg();d[b.dataset.k].push(b.dataset.k==='fontes'?{id:'f'+Date.now(),nome:''}:{id:'i'+Date.now(),nome:'',tipo:'Cartão'});S.finDraft=d;render();break}
    case 'fcfgdel':{const d=readFinCfg();d[b.dataset.k].splice(+b.dataset.i,1);S.finDraft=d;render();break}
    case 'fcfgsave':salvarFinCfg();break;
    case 'finicio':{await S.db.doc(finCfgW(S.fw)).set({titulo:'Finanças '+(S.fw==='dai'?'da Dai':'do Alex'),inicio:ym(new Date()),saldoInicial:0,acumula:true,fontes:[],itens:[]});S.tab='fincfg';render();break}
    case 'aim':S.aim=b.dataset.id;S.amesA=null;render();break;
    case 'ames':S.amesA=b.dataset.m;render();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'aprev':S.amesA=addMes(S.amesA,-1);render();break;
    case 'anext':S.amesA=addMes(S.amesA,1);render();break;
    case 'aitem':abrirAluItem(b.dataset.i);break;
    case 'aitemsave':salvarAluItem(false);break;
    case 'aitemdel':salvarAluItem(true);break;
    case 'apag':abrirAluPag();break;
    case 'apagsave':salvarAluPag();break;
    case 'apagp':S.apagP=b.dataset.p;document.querySelectorAll('[data-act=apagp]').forEach(x=>x.classList.toggle('on',x.dataset.p===S.apagP));break;
    case 'apagdel':excluirAluPag(b.dataset.id);break;
    case 'aconf':confirmarAluMes();break;
    case 'avenc':abrirAluVenc();break;
    case 'avencsave':salvarAluVenc();break;
    case 'acfg':S.tab='alucfg';S.aluDraft=null;render();window.scrollTo(0,0);break;
    case 'acfgadd':{const d=readAluCfg();if(b.dataset.k==='im')d.push({id:'im'+Date.now(),nome:'Novo imóvel',ativo:true,desde:ym(new Date()),dia:10,cd:.6,itensPadrao:[{nome:'Aluguel',v:0},{nome:'Condomínio',v:0}]});else d[+b.dataset.i].itensPadrao.push({nome:'',v:0});S.aluDraft=d;render();break}
    case 'acfgdel':{const d=readAluCfg();if(b.dataset.j!=null&&b.dataset.j!=='')d[+b.dataset.i].itensPadrao.splice(+b.dataset.j,1);else d.splice(+b.dataset.i,1);S.aluDraft=d;render();break}
    case 'acfgsave':salvarAluCfg();break;
    case 'metasave':salvarMetas(false);break;
    case 'metareset':salvarMetas(true);break;
    case 'metaedit':abrirMeta(b.dataset.c);break;
    case 'metaone':salvarMeta(false);break;
    case 'metaavg':salvarMeta(true);break;
    case 'lugares':S.tab='lugares';render();window.scrollTo(0,0);break;
    case 'tab':S.tab=b.dataset.t;render();window.scrollTo(0,0);break;
    case 'lord':S.lord=b.dataset.o;render();break;
    case 'lug':abrirLugar(b.dataset.k);break;
    case 'lugsave':salvarLugar();break;
    case 'catcancel':S.catDraft=null;render();break;
    case 'copy':copyMes();break;
    case 'logout':logout();break;
    case 'simular':location.hash='nfc-'+(1000+Math.floor(Math.random()*20000))+'-ZAFFARI-HIGIENOPOLIS';S.tab='mes';render();break;
    case 'fxadd':{const fx=readFixas();fx.push({nome:'Nova conta',t:'Outros',dia:10,v:0,cd:.5,chaves:''});S.cfg={...(S.cfg||{}),fixas:fx};render();break}
    case 'fxdel':{const fx=readFixas();fx.splice(+b.dataset.i,1);S.cfg={...(S.cfg||{}),fixas:fx};render();break}
    case 'fxsave':{await saveCfg({...(S.cfg||{}),fixas:readFixas()});toast('Contas fixas salvas ✓');break}
  }
});
document.addEventListener('change',e=>{if((e.target.id==='pde'||e.target.id==='pate')&&e.target.value&&S.per){S.per[e.target.id==='pde'?'de':'ate']=e.target.value;render();return}if(e.target.id==='fhist'&&e.target.files[0])importarHist(e.target.files[0])});
document.getElementById('scrim').onclick=()=>{if(S.me)closeSheet()};
document.getElementById('fab').onclick=()=>openForm({});
document.getElementById('meBtn').onclick=()=>askMe();
function readFixas(){return [...document.querySelectorAll('.fxe')].map(r=>{const g=k=>r.querySelector(`[data-k=${k}]`).value;return{nome:g('nome'),t:g('t'),dia:+g('dia')||1,v:parseVal(g('v'))||0,cd:Math.min(1,Math.max(0,(+g('cd')||0)/100)),chaves:g('chaves')}})}
async function copyMes(){
  const list=doMes(entries(),S.mes).slice().reverse();
  const n=x=>String(Math.round(x*100)/100).replace('.',',');
  const tsv=list.map(e=>[e.d.split('-').reverse().join('/'),'','',n(e.v),e.p,e.l,n(+e.cd),n(e.v*e.cd),n(1-e.cd),n(e.v*(1-e.cd)),e.t].join('\t')).join('\n');
  try{await navigator.clipboard.writeText(tsv);toast('Copiado! Cole na coluna A da planilha.')}
  catch(e){const sh=document.getElementById('sheet');sh.innerHTML=`<div class="grab"></div><h3>Copiar para a planilha<button class="btn light sm" data-act="close">Fechar</button></h3><p class="hint">Selecione tudo e copie:</p><textarea class="inp" rows="10" style="font-family:ui-monospace,monospace;font-size:12px">${esc(tsv)}</textarea>`;document.getElementById('scrim').classList.add('on');sh.classList.add('on')}
}
init();
</script>
